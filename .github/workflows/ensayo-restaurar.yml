name: Ensayo de restauración

# Restaura un respaldo en la base de ensayo y cuenta lo que llegó.
#
# Existe como flujo y no como lista de pasos por dos razones. La primera: un
# ensayo que exige instalar el cliente de Postgres en Windows, bajar tres
# archivos y acordarse del orden **se hace una vez y no se repite**, y un
# respaldo sin ensayo reciente es una promesa, no una garantía. La segunda: el
# día que haya que restaurar de verdad, el procedimiento va a estar probado en
# vez de improvisado.
#
# Solo se dispara a mano. No tiene horario a propósito: escribe sobre una base.

on:
  workflow_dispatch:
    inputs:
      fecha:
        description: "Fecha del respaldo a restaurar (AAAA-MM-DD). Vacío = hoy."
        required: false
        type: string

concurrency:
  group: ensayo-restaurar
  cancel-in-progress: false

jobs:
  restaurar:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # El seguro va primero y antes de instalar nada: si el destino está mal,
      # que falle en diez segundos y sin haber tocado una base.
      #
      # Se compara el identificador del proyecto que trae la cadena de conexión
      # —`postgres.<ref>` en el pooler— contra el del respaldo, que es el de
      # producción. Si coinciden, o si no se puede leer ninguno de los dos, el
      # flujo se niega. **Negarse ante la duda es la postura correcta acá**: el
      # peor error posible de este flujo es escribir sobre los datos reales.
      - name: Comprobar que el destino no es producción
        env:
          ENSAYO_DB_URL: ${{ secrets.ENSAYO_DB_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$ENSAYO_DB_URL" ]; then
            echo "Falta el secreto ENSAYO_DB_URL." >&2
            exit 1
          fi

          ref_de() { printf '%s' "$1" | grep -oE 'postgres\.[a-z0-9]{16,}' | head -1; }
          ensayo=$(ref_de "$ENSAYO_DB_URL")
          real=$(ref_de "$SUPABASE_DB_URL")

          if [ -z "$ensayo" ] || [ -z "$real" ]; then
            echo "No se pudo identificar el proyecto en una de las dos cadenas." >&2
            echo "Se necesita la cadena del pooler, en modo session." >&2
            exit 1
          fi
          if [ "$ensayo" = "$real" ]; then
            echo "ENSAYO_DB_URL apunta al proyecto REAL. No se hace nada." >&2
            exit 1
          fi
          echo "Destino verificado: es un proyecto distinto del de producción."

      - name: Bajar el respaldo de R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BALDE: ${{ vars.R2_BUCKET_RESPALDOS }}
          FECHA_PEDIDA: ${{ inputs.fecha }}
        run: |
          FECHA="${FECHA_PEDIDA:-$(date -u +%Y-%m-%d)}"
          echo "Restaurando el respaldo del $FECHA."

          bajar() {
            npx --yes wrangler@4 r2 object get \
              "${BALDE}/${FECHA}/$1" --file "$1" --remote
          }

          # Los dos archivos obligatorios. Si falta alguno, el respaldo de esa
          # fecha **no se puede restaurar**, y conviene decirlo con esas palabras:
          # «The specified key does not exist» manda a buscar un problema de
          # permisos que no existe.
          #
          # El caso realista no es un error de tipeo: es un respaldo anterior al
          # 2026-09-09, cuando el flujo todavía no generaba estos archivos. Esos
          # respaldos viejos no sirven, y es mejor saberlo acá que a mitad de una
          # restauración de verdad.
          for obligatorio in respaldo-completo.dump respaldo-auth-users.sql.gz \
                             respaldo-migraciones.sql.gz respaldo-storage.sql.gz respaldo-permisos.sql.gz; do
            if ! bajar "$obligatorio"; then
              echo "::error::El respaldo del $FECHA no tiene $obligatorio."
              echo "" >&2
              echo "Sin ese archivo no hay restauración posible." >&2
              echo "Si el respaldo es anterior al 2026-09-09, es esperable: el flujo" >&2
              echo "todavía no lo generaba. Corré «Respaldo diario de la base» y" >&2
              echo "volvé a intentar con la fecha de hoy." >&2
              exit 1
            fi
          done

          # Mejor esfuerzo: sin esto la base restaura y falla iniciar sesión.
          #
          # Una descarga fallida puede dejar el archivo creado y vacío, y un
          # `gunzip` sobre eso cortaría el paso entero por algo opcional. Se
          # comprueba que sea un gzip válido y, si no lo es, se borra.
          if ! bajar respaldo-auth-identities.sql.gz \
               || ! gzip -t respaldo-auth-identities.sql.gz 2>/dev/null; then
            echo "::warning::Ese respaldo no trae auth.identities. La base restaura igual."
            rm -f respaldo-auth-identities.sql.gz
          fi

          gunzip -f respaldo-auth-users.sql.gz respaldo-migraciones.sql.gz respaldo-storage.sql.gz respaldo-permisos.sql.gz
          # Con `if` y no con `[ -f ] && ...`: bajo `set -e`, una prueba que da
          # falso al final de una tubería corta el paso entero, y este archivo
          # puede legítimamente no estar.
          if [ -f respaldo-auth-identities.sql.gz ]; then
            gunzip -f respaldo-auth-identities.sql.gz
          fi

          ls -lh respaldo-*
          echo "FECHA_RESPALDO=$FECHA" >> "$GITHUB_ENV"

      - name: Instalar el cliente de Postgres 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          if [ ! -x /usr/lib/postgresql/17/bin/pg_restore ]; then
            echo "No quedó instalado el cliente 17." >&2
            exit 1
          fi

      # Vaciar es lo que hace el ensayo repetible, y va acá y no dentro de
      # pg_restore. `--clean --if-exists` no sirve: su `if exists` protege contra
      # que falte la política, no contra que falte la tabla, así que sobre una
      # base recién creada muere en la primera sentencia.
      - name: Vaciar la base de ensayo
        env:
          ENSAYO_DB_URL: ${{ secrets.ENSAYO_DB_URL }}
        run: |
          /usr/lib/postgresql/17/bin/psql "$ENSAYO_DB_URL" \
            -v ON_ERROR_STOP=1 -f supabase/restauracion/00-vaciar.sql

      # Las extensiones no están en el volcado: no pertenecen a `public` ni a
      # `private`. Sin esto, pg_restore muere en el índice de búsqueda.
      - name: Preámbulo — extensiones
        env:
          ENSAYO_DB_URL: ${{ secrets.ENSAYO_DB_URL }}
        run: |
          /usr/lib/postgresql/17/bin/psql "$ENSAYO_DB_URL" \
            -v ON_ERROR_STOP=1 -f supabase/restauracion/01-preambulo.sql

      # Las cuentas van ANTES del volcado, y ese orden no es preferencia.
      #
      # Siete claves foráneas de `public` apuntan a `auth.users`, incluida
      # `negocios.admin_user_id`, que es `not null`. `pg_restore` crea las
      # restricciones al final, y si en ese momento la tabla de cuentas está
      # vacía, todas fallan y no queda nada restaurado.
      - name: Cargar las cuentas
        env:
          ENSAYO_DB_URL: ${{ secrets.ENSAYO_DB_URL }}
        run: |
          PSQL=/usr/lib/postgresql/17/bin/psql

          "$PSQL" "$ENSAYO_DB_URL" -v ON_ERROR_STOP=1 -f respaldo-auth-users.sql

          # Después de las cuentas, porque las referencia.
          if [ -f respaldo-auth-identities.sql ]; then
            if ! "$PSQL" "$ENSAYO_DB_URL" -v ON_ERROR_STOP=1 -f respaldo-auth-identities.sql; then
              echo "::warning::No se cargaron las identidades. La base restaura; iniciar sesión no."
            fi
          fi

          cuentas=$("$PSQL" "$ENSAYO_DB_URL" -tAc "select count(*) from auth.users;")
          echo "Cuentas cargadas: $cuentas"
          if [ "$cuentas" -lt 1 ]; then
            echo "::error::Ninguna cuenta cargada: las claves foráneas van a fallar."
            exit 1
          fi

      # Sin `--clean`: la base ya se vació en el paso correspondiente. Con
      # `--exit-on-error`, que es lo que convierte esto en una comprobación: un
      # pg_restore que sigue después de un error termina en verde con la mitad de
      # la base, y eso es peor que fallar.
      - name: Restaurar
        env:
          ENSAYO_DB_URL: ${{ secrets.ENSAYO_DB_URL }}
        run: |
          PG_RESTORE=/usr/lib/postgresql/17/bin/pg_restore

          # El volcado trae `create schema public`, y en Supabase ese esquema ya
          # existe: pg_restore muere con «schema public already exists». Las dos
          # salidas fáciles están descartadas —`--clean` rompe en el drop policy,
          # y borrar el esquema se lleva los privilegios por defecto de la API—,
          # así que se saltean las entradas de tipo SCHEMA del índice del volcado
          # y los crea el preámbulo, que es código versionado y revisable.
          #
          # `--list` y `-L` son el mecanismo del propio pg_restore para esto: se
          # edita el índice, no el archivo.
          "$PG_RESTORE" --list respaldo-completo.dump > indice-completo.txt
          grep -vE '^[0-9]+; [0-9]+ [0-9]+ (SCHEMA |COMMENT - SCHEMA )' indice-completo.txt > indice.txt

          salteadas=$(( $(grep -cE '^[0-9]+; [0-9]+ [0-9]+ (SCHEMA |COMMENT - SCHEMA )' indice-completo.txt || true) ))
          echo "Entradas de tipo SCHEMA salteadas: $salteadas (las crea el preámbulo)."

          "$PG_RESTORE" \
            --dbname "$ENSAYO_DB_URL" \
            --no-owner --no-privileges \
            --exit-on-error \
            -L indice.txt \
            respaldo-completo.dump
          echo "Restauración terminada sin errores."

      # Una base con la estructura correcta que no sabe cómo llegó a tenerla no
      # acepta la próxima migración: `supabase db push` intentaría aplicar las 47
      # desde cero y chocaría contra objetos que ya existen. Para las nueve fases
      # que vienen, eso es la diferencia entre una base de ensayo utilizable y
      # una copia de adorno.
      - name: Restaurar el historial de migraciones
        env:
          ENSAYO_DB_URL: ${{ secrets.ENSAYO_DB_URL }}
        run: |
          PSQL=/usr/lib/postgresql/17/bin/psql
          "$PSQL" "$ENSAYO_DB_URL" -v ON_ERROR_STOP=1 -f respaldo-migraciones.sql

          # Se compara contra los archivos del repositorio, que es la única
          # fuente que dice cuántas debería haber.
          en_repo=$(ls supabase/migrations/*.sql | wc -l)
          en_base=$("$PSQL" "$ENSAYO_DB_URL" -tAc \
            "select count(*) from supabase_migrations.schema_migrations;")
          echo "Migraciones: $en_base en la base, $en_repo en el repositorio."

          if [ "$en_base" -ne "$en_repo" ]; then
            echo "::warning::No coinciden. Si el respaldo es de antes de la última"
            echo "migración es esperable; si no, hay que revisarlo." >&2
          fi

      # Los permisos, que el volcado descarta con --no-privileges.
      #
      # Va DESPUÉS de pg_restore, porque otorga sobre tablas que tienen que
      # existir, y es lo que devuelve a la base restaurada el modelo de permisos
      # del original: `authenticated` con solo `select` sobre `pedidos`, sin
      # `update` sobre `negocios`. Sin este paso la copia queda más permisiva que
      # producción, que es la peor forma de fallar de un respaldo.
      - name: Restaurar los permisos
        env:
          ENSAYO_DB_URL: ${{ secrets.ENSAYO_DB_URL }}
        run: |
          /usr/lib/postgresql/17/bin/psql "$ENSAYO_DB_URL"             -v ON_ERROR_STOP=1 -q -f respaldo-permisos.sql
          echo "Permisos restaurados."

      # Los depósitos de Storage y sus políticas, que viven en el esquema
      # `storage` y por eso no vienen en el volcado. Sin esto la base restaurada
      # no sirve ninguna imagen y, peor, acepta subidas sin comprobar de quién es
      # la carpeta. El archivo lo generó el respaldo leyendo la base viva, así que
      # dice lo que había y no lo que alguien recuerda que había.
      - name: Restaurar los depósitos de Storage
        env:
          ENSAYO_DB_URL: ${{ secrets.ENSAYO_DB_URL }}
        run: |
          PSQL=/usr/lib/postgresql/17/bin/psql
          "$PSQL" "$ENSAYO_DB_URL" -v ON_ERROR_STOP=1 -f respaldo-storage.sql

          "$PSQL" "$ENSAYO_DB_URL" -v ON_ERROR_STOP=1 -c "
            select
              (select count(*) from storage.buckets) as depositos,
              (select count(*) from pg_policies where schemaname = 'storage') as politicas;"

      # Los datos sin las tareas programadas son una base que no hace nada sola.
      - name: Postámbulo — tareas programadas
        env:
          ENSAYO_DB_URL: ${{ secrets.ENSAYO_DB_URL }}
        run: |
          /usr/lib/postgresql/17/bin/psql "$ENSAYO_DB_URL" \
            -v ON_ERROR_STOP=1 -f supabase/restauracion/02-postambulo.sql

      # Que el comando haya terminado sin error no dice que no falte nada. Lo
      # que decide es el conteo, y por eso se imprime.
      - name: Contar lo que llegó
        env:
          ENSAYO_DB_URL: ${{ secrets.ENSAYO_DB_URL }}
        run: |
          /usr/lib/postgresql/17/bin/psql "$ENSAYO_DB_URL" -v ON_ERROR_STOP=1 -c "
            select 'negocios' as tabla, count(*) from public.negocios
            union all select 'categorias', count(*) from public.categorias
            union all select 'subcategorias', count(*) from public.subcategorias
            union all select 'productos', count(*) from public.productos
            union all select 'promociones', count(*) from public.promociones
            union all select 'pedidos', count(*) from public.pedidos
            union all select 'pedido_items', count(*) from public.pedido_items
            union all select 'ajustes_vigilancia', count(*) from private.ajustes_vigilancia
            order by 1;"

      # Que los datos estén no alcanza. Estas dos cosas deciden si la base
      # restaurada **se puede usar**, y las dos se pueden perder sin que nada
      # falle: por eso se comprueban y no se miran.
      # La comprobacion definitiva, y la unica que no envejece.
      #
      # Las versiones anteriores de este paso afirmaban a mano lo que el sistema
      # deberia ser —«veinte politicas», «anon puede leer negocios»— y fallaron
      # las dos veces con una restauracion CORRECTA: la primera porque habia
      # dieciocho politicas, la segunda porque en produccion anon **no** puede
      # leer negocios. Cada hecho escrito a mano acá es una suposicion que
      # envejece y que ademas hay que recordar actualizar en cada fase.
      #
      # Entonces no se afirma nada: se **compara la copia contra el respaldo**.
      # El mismo guion que genero el archivo de permisos se corre ahora contra la
      # base restaurada, y las dos salidas tienen que ser identicas. Si lo son,
      # la copia tiene exactamente el modelo de permisos del original — ni mas
      # abierta ni mas cerrada— sin que nadie tenga que saber cual es.
      - name: Comprobar que la copia es igual al original
        env:
          ENSAYO_DB_URL: ${{ secrets.ENSAYO_DB_URL }}
        run: |
          PSQL=/usr/lib/postgresql/17/bin/psql

          # Las politicas, contra lo que el indice del volcado dice que trae.
          esperadas=$(( $(grep -cE '^[0-9]+; [0-9]+ [0-9]+ POLICY public ' indice-completo.txt || true) ))
          politicas=$("$PSQL" "$ENSAYO_DB_URL" -tAc             "select count(*) from pg_policies where schemaname = 'public';")
          echo "Politicas RLS en public: $politicas (el volcado trae $esperadas)"
          if [ "$esperadas" -lt 1 ]; then
            echo "::error::El volcado no trae ninguna politica RLS. El respaldo esta mal hecho."
            exit 1
          fi
          if [ "$politicas" -ne "$esperadas" ]; then
            echo "::error::Se restauraron $politicas de $esperadas politicas: falta aislamiento."
            exit 1
          fi

          # Los permisos, contra el archivo del respaldo.
          PGOPTIONS='-c search_path=' "$PSQL" "$ENSAYO_DB_URL"             -tA -o permisos-restaurados.sql             -f supabase/restauracion/generar-permisos.sql

          sort respaldo-permisos.sql > esperado.txt
          sort permisos-restaurados.sql > obtenido.txt

          if ! diff -u esperado.txt obtenido.txt > diferencias.txt; then
            echo "::error::Los permisos de la copia NO coinciden con los del original."
            echo "" >&2
            echo "Cada linea con - es un permiso que produccion tiene y la copia no." >&2
            echo "Cada linea con + es uno que la copia tiene de mas." >&2
            echo "" >&2
            head -60 diferencias.txt >&2
            exit 1
          fi

          echo "Los permisos de la copia son identicos a los del original:"
          echo "  $(grep -c '^grant ' esperado.txt) otorgamientos, comparados uno por uno."

      - name: Resumen
        run: |
          echo "### Ensayo de restauración" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Respaldo del **$FECHA_RESPALDO** restaurado en la base de ensayo." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Anotá la fecha en la tabla de \`docs/RESPALDOS.md\`." >> "$GITHUB_STEP_SUMMARY"
