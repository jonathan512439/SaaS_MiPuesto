name: Respaldo diario de la base

# Un volcado por día a R2. La base es lo irreemplazable: los productos, los
# pedidos y los vencimientos de cada negocio. Sin esto, cobrar por custodiar
# datos que no se respaldan es un riesgo que se paga una sola vez y caro.
#
# Corre a las 07:00 UTC —03:00 en Bolivia—, antes de la purga de analítica
# (08:30) y del corte por vencimiento (09:00), para que el respaldo del día
# refleje el estado previo a cualquier borrado automático.

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

concurrency:
  group: respaldo
  cancel-in-progress: false

jobs:
  respaldar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Que el permiso a R2 se compruebe ANTES de volcar y no después.
      #
      # Con la comprobación al final, un token sin permiso de escritura costaba
      # tres minutos de instalar Postgres y volcar la base para recién entonces
      # avisar. Y avisaba con un 403 de la API, que no dice cuál de los diez
      # permisos falta.
      #
      # Escribe un objeto de prueba y lo borra: es la única forma de comprobar el
      # permiso que de verdad importa. Listar los baldes lo pasaría un token de
      # solo lectura, que es justo el caso que hay que atrapar.
      - name: Comprobar el acceso de escritura a R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BALDE: ${{ vars.R2_BUCKET_RESPALDOS }}
        run: |
          if [ -z "$BALDE" ]; then
            echo "Falta la variable R2_BUCKET_RESPALDOS." >&2
            exit 1
          fi

          echo "prueba de acceso" > prueba-de-acceso.txt
          if ! npx --yes wrangler@4 r2 object put \
                 "${BALDE}/.acceso/prueba.txt" \
                 --file prueba-de-acceso.txt --remote; then
            echo "::error::El token de Cloudflare no puede escribir en el balde ${BALDE}."
            echo "Necesita el permiso de CUENTA «Workers R2 Storage» en modo «Edit»." >&2
            echo "Se edita en https://dash.cloudflare.com/profile/api-tokens" >&2
            exit 1
          fi

          npx --yes wrangler@4 r2 object delete "${BALDE}/.acceso/prueba.txt" --remote || true
          rm -f prueba-de-acceso.txt
          echo "El token puede escribir en ${BALDE}."

      # pg_dump directo y no `supabase db dump`, que exige Docker. El cliente se
      # instala en la versión del servidor —Postgres 17— porque un pg_dump más
      # viejo se niega a volcar una base más nueva.
      #
      # **Se invoca por ruta absoluta y no por nombre.** El `/usr/bin/pg_dump` de
      # estos servidores es el envoltorio de Debian, que elige la versión según el
      # clúster configurado en la imagen —16— y no según la más nueva instalada.
      # Con `pg_dump` a secas, instalar el 17 no cambiaba nada y el volcado moría
      # con «server version mismatch» después de haberse conectado bien.
      - name: Instalar el cliente de Postgres 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

          # Que la instalación falle acá y no doce líneas más abajo, con la base
          # ya conectada y el mensaje hablando de otra cosa.
          if [ ! -x /usr/lib/postgresql/17/bin/pg_dump ]; then
            echo "No quedó instalado /usr/lib/postgresql/17/bin/pg_dump." >&2
            ls -la /usr/lib/postgresql/ >&2 || true
            exit 1
          fi
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Volcar la base
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "Falta el secreto SUPABASE_DB_URL." >&2
            exit 1
          fi
          # El esquema y los datos por separado: restaurar solo los datos sobre
          # un esquema sano es lo que se necesita casi siempre.
          #
          # **`private` va junto con `public` y no es opcional.** Ahí viven siete
          # funciones que los disparadores y las políticas de `public` invocan
          # —cálculo de precios, auditoría de cambios, validación de promociones—
          # y la tabla con los ajustes del vigilante. Un volcado de `public` a
          # secas no se puede restaurar: las políticas referencian funciones que
          # no estarían. Se descubrió al preparar el ensayo de restauración.
          PG_DUMP=/usr/lib/postgresql/17/bin/pg_dump

          # **El archivo que de verdad se restaura.** Formato personalizado, que
          # `pg_restore` sabe ordenar: crea las tablas, carga los datos y recién
          # entonces agrega las claves foráneas. Los dos volcados de texto de
          # abajo, partidos en esquema y datos, pierden esa garantía de orden y
          # sirven para leer o para restaurar una tabla suelta, no para levantar
          # la base entera. Se descubrió preparando el ensayo.
          "$PG_DUMP" "$SUPABASE_DB_URL" --format=custom --compress=9 \
            --schema=public --schema=private \
            --no-owner --no-privileges -f respaldo-completo.dump

          "$PG_DUMP" "$SUPABASE_DB_URL" --schema-only \
            --schema=public --schema=private \
            --no-owner --no-privileges -f respaldo-esquema.sql
          "$PG_DUMP" "$SUPABASE_DB_URL" --data-only \
            --schema=public --schema=private \
            --no-owner --no-privileges -f respaldo-datos.sql

          # **Las cuentas son obligatorias, no un extra.**
          #
          # Acá decía que si el volcado de `auth` fallaba, la base seguía
          # respaldada y solo había que reinvitar a los dueños. Era falso, y lo
          # demostró el ensayo: siete claves foráneas apuntan a `auth.users`, y
          # una de ellas es `negocios.admin_user_id`, que es `not null`. Sin las
          # cuentas, `pg_restore` no puede crear las restricciones y **no hay
          # restauración**, ni parcial ni de ningún tipo.
          #
          # Van en dos archivos y no en uno para poder cargarlos en orden:
          # `identities` referencia a `users`, y un volcado del esquema entero
          # sale ordenado alfabéticamente, o sea al revés del que hace falta.
          "$PG_DUMP" "$SUPABASE_DB_URL" --data-only --table=auth.users \
            --no-owner --no-privileges -f respaldo-auth-users.sql
          gzip respaldo-auth-users.sql

          # Las identidades sí son mejor esfuerzo: sin ellas la base restaura
          # entera y lo que falla es iniciar sesión, que se resuelve con un
          # enlace de acceso. Sin `users` no restaura nada.
          if "$PG_DUMP" "$SUPABASE_DB_URL" --data-only --table=auth.identities \
               --no-owner --no-privileges -f respaldo-auth-identities.sql; then
            gzip respaldo-auth-identities.sql
          else
            echo "::warning::No se pudo volcar auth.identities. La base restaura igual."
            rm -f respaldo-auth-identities.sql
          fi

          gzip respaldo-esquema.sql respaldo-datos.sql
          ls -lh respaldo-*.sql.gz

      # Un volcado de cero bytes sube igual y da una falsa sensación de respaldo.
      - name: Comprobar que el volcado tiene contenido
        run: |
          # El archivo del que depende una restauración de verdad: que exista y
          # que pg_restore lo pueda leer. Un archivo corrupto pesa igual.
          /usr/lib/postgresql/17/bin/pg_restore --list respaldo-completo.dump > /dev/null
          echo "respaldo-completo.dump es legible por pg_restore."

          for archivo in respaldo-completo.dump respaldo-esquema.sql.gz respaldo-datos.sql.gz; do
            tamano=$(stat -c%s "$archivo")
            if [ "$tamano" -lt 1024 ]; then
              echo "$archivo pesa $tamano bytes: el volcado falló." >&2
              exit 1
            fi
          done

          # Que el esquema `private` esté adentro, y no confiar en que la bandera
          # esté puesta. Sin él, el volcado pesa igual, sube igual y solo se
          # descubre inservible el día que hay que restaurar. Un respaldo que
          # aparenta estar bien es peor que uno que falla ruidosamente.
          # Se busca cualquier objeto calificado con `private.` —una función, la
          # tabla de ajustes— y no la sentencia exacta que crea el esquema: el
          # texto que emite pg_dump puede cambiar entre versiones y una guardia
          # que se rompe sola termina desactivada.
          if ! zgrep -q "private\." respaldo-esquema.sql.gz; then
            echo "El volcado del esquema no incluye 'private': no se podría restaurar." >&2
            exit 1
          fi

          # Las cuentas, por contenido y no por peso: con pocos dueños el archivo
          # comprimido puede pesar menos de un kilobyte y ser correcto.
          if ! zgrep -q "COPY auth\.users" respaldo-auth-users.sql.gz; then
            echo "El volcado de cuentas no trae auth.users: la base no se podría restaurar." >&2
            exit 1
          fi
          echo "El volcado incluye public, private y las cuentas."

      - name: Subir a R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BALDE: ${{ vars.R2_BUCKET_RESPALDOS }}
        run: |
          if [ -z "$BALDE" ]; then
            echo "Falta la variable R2_BUCKET_RESPALDOS." >&2
            exit 1
          fi
          FECHA=$(date -u +%Y-%m-%d)
          # El de auth puede no existir: se sube lo que haya, y por eso el bucle
          # recorre los archivos presentes en vez de una lista fija. El patrón
          # toma `.dump` además de `.sql.gz`; con el patrón viejo el archivo más
          # importante se quedaba en el servidor.
          for archivo in respaldo-completo.dump respaldo-*.sql.gz; do
            npx --yes wrangler@4 r2 object put \
              "${BALDE}/${FECHA}/${archivo}" \
              --file "${archivo}" \
              --remote
          done
          echo "Respaldo del $FECHA subido a $BALDE."
