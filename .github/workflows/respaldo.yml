name: Respaldo diario de la base

# Un volcado por día a R2. La base es lo irreemplazable: los productos, los
# pedidos y los vencimientos de cada negocio. Sin esto, cobrar por custodiar
# datos que no se respaldan es un riesgo que se paga una sola vez y caro.
#
# Corre a las 07:00 UTC —03:00 en Bolivia—, antes de la purga de analítica
# (08:30) y del corte por vencimiento (09:00), para que el respaldo del día
# refleje el estado previo a cualquier borrado automático.

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

concurrency:
  group: respaldo
  cancel-in-progress: false

jobs:
  respaldar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Que el permiso a R2 se compruebe ANTES de volcar y no después.
      #
      # Con la comprobación al final, un token sin permiso de escritura costaba
      # tres minutos de instalar Postgres y volcar la base para recién entonces
      # avisar. Y avisaba con un 403 de la API, que no dice cuál de los diez
      # permisos falta.
      #
      # Escribe un objeto de prueba y lo borra: es la única forma de comprobar el
      # permiso que de verdad importa. Listar los baldes lo pasaría un token de
      # solo lectura, que es justo el caso que hay que atrapar.
      - name: Comprobar el acceso de escritura a R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BALDE: ${{ vars.R2_BUCKET_RESPALDOS }}
        run: |
          if [ -z "$BALDE" ]; then
            echo "Falta la variable R2_BUCKET_RESPALDOS." >&2
            exit 1
          fi

          echo "prueba de acceso" > prueba-de-acceso.txt
          if ! npx --yes wrangler@4 r2 object put \
                 "${BALDE}/.acceso/prueba.txt" \
                 --file prueba-de-acceso.txt --remote; then
            echo "::error::El token de Cloudflare no puede escribir en el balde ${BALDE}."
            echo "Necesita el permiso de CUENTA «Workers R2 Storage» en modo «Edit»." >&2
            echo "Se edita en https://dash.cloudflare.com/profile/api-tokens" >&2
            exit 1
          fi

          npx --yes wrangler@4 r2 object delete "${BALDE}/.acceso/prueba.txt" --remote || true
          rm -f prueba-de-acceso.txt
          echo "El token puede escribir en ${BALDE}."

      # pg_dump directo y no `supabase db dump`, que exige Docker. El cliente se
      # instala en la versión del servidor —Postgres 17— porque un pg_dump más
      # viejo se niega a volcar una base más nueva.
      #
      # **Se invoca por ruta absoluta y no por nombre.** El `/usr/bin/pg_dump` de
      # estos servidores es el envoltorio de Debian, que elige la versión según el
      # clúster configurado en la imagen —16— y no según la más nueva instalada.
      # Con `pg_dump` a secas, instalar el 17 no cambiaba nada y el volcado moría
      # con «server version mismatch» después de haberse conectado bien.
      - name: Instalar el cliente de Postgres 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

          # Que la instalación falle acá y no doce líneas más abajo, con la base
          # ya conectada y el mensaje hablando de otra cosa.
          if [ ! -x /usr/lib/postgresql/17/bin/pg_dump ]; then
            echo "No quedó instalado /usr/lib/postgresql/17/bin/pg_dump." >&2
            ls -la /usr/lib/postgresql/ >&2 || true
            exit 1
          fi
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Volcar la base
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "Falta el secreto SUPABASE_DB_URL." >&2
            exit 1
          fi
          # El esquema y los datos por separado: restaurar solo los datos sobre
          # un esquema sano es lo que se necesita casi siempre.
          #
          # **`private` va junto con `public` y no es opcional.** Ahí viven siete
          # funciones que los disparadores y las políticas de `public` invocan
          # —cálculo de precios, auditoría de cambios, validación de promociones—
          # y la tabla con los ajustes del vigilante. Un volcado de `public` a
          # secas no se puede restaurar: las políticas referencian funciones que
          # no estarían. Se descubrió al preparar el ensayo de restauración.
          PG_DUMP=/usr/lib/postgresql/17/bin/pg_dump

          # **El archivo que de verdad se restaura.** Formato personalizado, que
          # `pg_restore` sabe ordenar: crea las tablas, carga los datos y recién
          # entonces agrega las claves foráneas. Los dos volcados de texto de
          # abajo, partidos en esquema y datos, pierden esa garantía de orden y
          # sirven para leer o para restaurar una tabla suelta, no para levantar
          # la base entera. Se descubrió preparando el ensayo.
          "$PG_DUMP" "$SUPABASE_DB_URL" --format=custom --compress=9 \
            --schema=public --schema=private \
            --no-owner --no-privileges -f respaldo-completo.dump

          "$PG_DUMP" "$SUPABASE_DB_URL" --schema-only \
            --schema=public --schema=private \
            --no-owner --no-privileges -f respaldo-esquema.sql
          "$PG_DUMP" "$SUPABASE_DB_URL" --data-only \
            --schema=public --schema=private \
            --no-owner --no-privileges -f respaldo-datos.sql

          # **Las cuentas son obligatorias, no un extra.**
          #
          # Acá decía que si el volcado de `auth` fallaba, la base seguía
          # respaldada y solo había que reinvitar a los dueños. Era falso, y lo
          # demostró el ensayo: siete claves foráneas apuntan a `auth.users`, y
          # una de ellas es `negocios.admin_user_id`, que es `not null`. Sin las
          # cuentas, `pg_restore` no puede crear las restricciones y **no hay
          # restauración**, ni parcial ni de ningún tipo.
          #
          # Van en dos archivos y no en uno para poder cargarlos en orden:
          # `identities` referencia a `users`, y un volcado del esquema entero
          # sale ordenado alfabéticamente, o sea al revés del que hace falta.
          "$PG_DUMP" "$SUPABASE_DB_URL" --data-only --table=auth.users \
            --no-owner --no-privileges -f respaldo-auth-users.sql
          gzip respaldo-auth-users.sql

          # El historial de migraciones. Sin él, la base restaurada tiene la
          # estructura correcta y **no sabe cómo llegó a tenerla**: el siguiente
          # `supabase db push` intentaría aplicar las 47 desde cero y chocaría
          # contra objetos que ya existen. Una base a la que no se le puede
          # aplicar la próxima migración no está del todo restaurada.
          # **Con estructura y no solo datos**, al revés que los volcados de
          # `auth`. El proyecto donde se restaura puede no tener el esquema
          # `supabase_migrations`: lo crea el CLI de Supabase en su primer
          # `db push`, no viene con el proyecto. Si el volcado llevara solo los
          # datos, habría que escribir a mano las columnas de esa tabla en el
          # preámbulo, y el día que el CLI le agregue una, el respaldo dejaría de
          # cargar. Que el volcado se describa a sí mismo evita esa adivinanza.
          "$PG_DUMP" "$SUPABASE_DB_URL" \
            --table=supabase_migrations.schema_migrations \
            --no-owner --no-privileges -f respaldo-migraciones.sql
          gzip respaldo-migraciones.sql

          # Los depósitos de Storage y sus políticas.
          #
          # Viven en el esquema `storage`, que administra Supabase y no se puede
          # volcar entero sin pisarle sus propias tablas. Pero sin ellos la base
          # restaurada no sirve ninguna imagen **y no tiene aislamiento en las
          # subidas**: cualquiera podría escribir en la carpeta de otro negocio.
          #
          # En vez de copiar las políticas de las migraciones a un archivo aparte
          # —que se desincronizaría—, se **generan desde la base viva**. Lo que se
          # respalda es lo que hay, no lo que alguien recuerda que había.
          #
          # **Se genera con `search_path` vacío**, y eso no es un detalle. Postgres
          # escribe las expresiones de una política omitiendo el esquema de todo lo
          # que ya está visible: con el camino por defecto, una política que mira
          # `public.negocios` sale escrita como `negocios` a secas. Al restaurarla
          # en otra sesión ese contexto no es el mismo y falla con «relation
          # negocios does not exist». Con el camino vacío, Postgres califica todo,
          # y el archivo deja de depender de dónde se lo aplique.
          #
          # La primera línea del archivo fija igual un `search_path` razonable:
          # cuesta nada y cubre cualquier expresión que se resista a calificarse.
          # El camino vacío se fija en la conexión con PGOPTIONS y **no** con un
          # `-c "set search_path = ''"`: psql escribe la etiqueta de estado de
          # cada orden en su salida, y `-o` la manda al archivo. Así quedaba una
          # línea suelta con «SET» arriba de todo, que Postgres leía pegada a la
          # sentencia siguiente y hacía fallar la restauración en la línea 2.
          PGOPTIONS='-c search_path=' /usr/lib/postgresql/17/bin/psql "$SUPABASE_DB_URL" \
            -tA -o respaldo-storage.sql \
            -c "
            select linea from (
              select 0 as orden, 'set search_path = public, storage, extensions;' as linea
              union all
              select 1, format(
                'insert into storage.buckets (id, name, public, file_size_limit, allowed_mime_types)
                   values (%L, %L, %L, %L, %L::text[])
                   on conflict (id) do update set
                     public = excluded.public,
                     file_size_limit = excluded.file_size_limit,
                     allowed_mime_types = excluded.allowed_mime_types;',
                id, name, public, file_size_limit, allowed_mime_types)
              from storage.buckets
              union all
              select 2,
                format('drop policy if exists %I on %I.%I;', policyname, schemaname, tablename)
                || format(' create policy %I on %I.%I as %s for %s to %s',
                     policyname, schemaname, tablename, permissive, cmd,
                     array_to_string(roles, ', '))
                || coalesce(' using (' || qual || ')', '')
                || coalesce(' with check (' || with_check || ')', '')
                || ';'
              from pg_policies where schemaname = 'storage'
            ) generado order by orden;"
          gzip respaldo-storage.sql

          # Los permisos, que `pg_dump --no-privileges` descarta.
          #
          # Este sistema depende de permisos **recortados**: `authenticated` solo
          # tiene `select` sobre `pedidos`, y sobre `negocios` no tiene `update`.
          # Sin esto, la base restaurada queda más permisiva que el original — un
          # respaldo que restaura un sistema menos seguro que el que respaldó.
          # El motivo completo está en el encabezado del guion que se corre acá.
          PGOPTIONS='-c search_path=' /usr/lib/postgresql/17/bin/psql "$SUPABASE_DB_URL" \
            -tA -o respaldo-permisos.sql \
            -f supabase/restauracion/generar-permisos.sql
          gzip respaldo-permisos.sql

          # Las identidades sí son mejor esfuerzo: sin ellas la base restaura
          # entera y lo que falla es iniciar sesión, que se resuelve con un
          # enlace de acceso. Sin `users` no restaura nada.
          if "$PG_DUMP" "$SUPABASE_DB_URL" --data-only --table=auth.identities \
               --no-owner --no-privileges -f respaldo-auth-identities.sql; then
            gzip respaldo-auth-identities.sql
          else
            echo "::warning::No se pudo volcar auth.identities. La base restaura igual."
            rm -f respaldo-auth-identities.sql
          fi

          gzip respaldo-esquema.sql respaldo-datos.sql
          ls -lh respaldo-*.sql.gz

      # Un volcado de cero bytes sube igual y da una falsa sensación de respaldo.
      - name: Comprobar que el volcado tiene contenido
        run: |
          # El archivo del que depende una restauración de verdad: que exista y
          # que pg_restore lo pueda leer. Un archivo corrupto pesa igual.
          /usr/lib/postgresql/17/bin/pg_restore --list respaldo-completo.dump > /dev/null
          echo "respaldo-completo.dump es legible por pg_restore."

          for archivo in respaldo-completo.dump respaldo-esquema.sql.gz respaldo-datos.sql.gz; do
            tamano=$(stat -c%s "$archivo")
            if [ "$tamano" -lt 1024 ]; then
              echo "$archivo pesa $tamano bytes: el volcado falló." >&2
              exit 1
            fi
          done

          # Estas comprobaciones miran el CONTENIDO y no el peso, porque los seis
          # defectos que se encontraron el 2026-09-09 producían todos un archivo
          # de buen tamaño. Un respaldo que aparenta estar bien es peor que uno
          # que falla ruidosamente.
          #
          # **Se cuenta con `zgrep -c` y nunca con `zgrep -q`.** Con `-q`, zgrep
          # corta la lectura apenas encuentra la coincidencia, gzip se queda
          # escribiendo en una tubería cerrada y el estado de salida termina
          # reflejando ese fallo en vez del resultado de la búsqueda: a veces
          # devuelve cero y a veces uno, con el mismo archivo. Una guardia
          # intermitente es peor que una equivocada, porque enseña a ignorarla.
          # `-c` lee el archivo entero y no cierra nada antes de tiempo.
          # Y encaja con lo que pasó: en el archivo de migraciones la coincidencia
          # está en la primera línea y detrás vienen los 47 textos completos de
          # las migraciones, así que el corte es seguro. En los demás la
          # coincidencia llega tarde o el archivo es chico, y por eso pasaban.
          contar() {
            n=$(zgrep -c "$1" "$2" 2>/dev/null || true)
            # Vacío significa que el archivo no existe: cuenta como cero y el
            # llamador falla con su propio mensaje, no con «integer expression
            # expected».
            echo "${n:-0}"
          }

          # Cualquier objeto calificado con `private.` —una función, la tabla de
          # ajustes— y no la sentencia exacta que crea el esquema: el texto que
          # emite pg_dump puede cambiar entre versiones y una guardia que se
          # rompe sola termina desactivada.
          if [ "$(contar 'private\.' respaldo-esquema.sql.gz)" -lt 1 ]; then
            echo "El volcado del esquema no incluye 'private': no se podría restaurar." >&2
            exit 1
          fi

          # Las cuentas, por contenido y no por peso: con pocos dueños el archivo
          # comprimido puede pesar menos de un kilobyte y ser correcto.
          if [ "$(contar 'COPY auth\.users' respaldo-auth-users.sql.gz)" -lt 1 ]; then
            echo "El volcado de cuentas no trae auth.users: la base no se podría restaurar." >&2
            exit 1
          fi

          if [ "$(contar 'COPY supabase_migrations\.schema_migrations' respaldo-migraciones.sql.gz)" -lt 1 ]; then
            echo "El volcado no trae el historial de migraciones: la base restaurada" >&2
            echo "no podría recibir la próxima migración." >&2
            exit 1
          fi

          # Los depósitos sin sus políticas serían peor que nada: una base
          # restaurada que acepta subidas sin comprobar de quién es la carpeta.
          politicas=$(contar 'create policy' respaldo-storage.sql.gz)
          depositos=$(contar 'insert into storage.buckets' respaldo-storage.sql.gz)
          echo "Storage: $depositos depósitos y $politicas políticas."
          if [ "$depositos" -lt 1 ] || [ "$politicas" -lt 1 ]; then
            echo "El respaldo de Storage salió vacío: la base restaurada no serviría" >&2
            echo "imágenes y no tendría aislamiento en las subidas." >&2
            exit 1
          fi

          # Que no se haya colado una etiqueta de estado de psql —«SET», «INSERT
          # 0 1»— entre las sentencias. Una sola línea así pega dos sentencias en
          # una y el archivo deja de ser SQL válido, aunque tenga todo lo demás.
          #
          # Se recorren **los dos archivos generados**. La primera versión miraba
          # solo el de Storage, y el mismo error apareció después en el de
          # permisos por otro camino: una guardia que cubre un caso y no su
          # gemelo es media guardia.
          for generado in respaldo-storage.sql.gz respaldo-permisos.sql.gz; do
            if [ "$(contar '^\(SET\|INSERT [0-9]\|SELECT [0-9]\|GRANT\|REVOKE\|DROP\|CREATE\)$' "$generado")" -gt 0 ]; then
              echo "$generado tiene una etiqueta de estado de psql suelta:" >&2
              echo "no es SQL válido y no se podría aplicar." >&2
              exit 1
            fi
          done

          # Y que las políticas estén calificadas con su esquema: sin eso el
          # archivo solo sirve donde se generó, que es lo contrario de un respaldo.
          if [ "$(contar 'public\.negocios' respaldo-storage.sql.gz)" -lt 1 ]; then
            echo "Las políticas de Storage no salieron calificadas con su esquema." >&2
            echo "Al restaurarlas fallarían con «relation negocios does not exist»." >&2
            exit 1
          fi

          # Los permisos: que estén, que empiecen revocando y que conserven el
          # recorte que hace segura a esta base. Se comprueba una condición
          # concreta y no un conteo: que `authenticated` **no** reciba `update`
          # sobre `pedidos`. Es exactamente lo que se perdía.
          permisos=$(contar '^grant ' respaldo-permisos.sql.gz)
          echo "Permisos respaldados: $permisos."
          if [ "$permisos" -lt 50 ]; then
            echo "El respaldo de permisos salió corto: la base restaurada no" >&2
            echo "reproduciría el modelo de permisos del original." >&2
            exit 1
          fi
          if [ "$(contar '^revoke all on all tables' respaldo-permisos.sql.gz)" -lt 1 ]; then
            echo "El respaldo de permisos no revoca antes de otorgar: los permisos" >&2
            echo "por defecto de Supabase quedarían sumados a los reales." >&2
            exit 1
          fi
          if [ "$(contar 'grant UPDATE on table public.pedidos to authenticated' respaldo-permisos.sql.gz)" -gt 0 ]; then
            echo "El respaldo otorga UPDATE sobre pedidos a authenticated, que en" >&2
            echo "producción está revocado. Algo cambió y hay que revisarlo." >&2
            exit 1
          fi

          # Y que todo venga calificado con su esquema. Sin esto el guion solo
          # sirve donde el camino de búsqueda coincida con el de quien lo generó,
          # y un permiso que no se aplica no avisa: deja la copia abierta.
          # Los permisos por columna, que son la mitad del modelo y la que menos
          # se ve: `anon` lee el catálogo por columnas y el dueño escribe solo
          # algunas de las suyas. La primera versión del guion no los miraba y la
          # copia quedaba con el modelo de escritura desdibujado.
          #
          # Es un control estructural y no un hecho escrito a mano: no dice
          # cuántos ni cuáles, solo que la sección no desapareció.
          columnas=$(contar 'grant [A-Z]* (' respaldo-permisos.sql.gz)
          echo "Permisos por columna: $columnas."
          if [ "$columnas" -lt 1 ]; then
            echo "El respaldo no trae ningún permiso por columna. El catálogo público" >&2
            echo "lee la tabla de negocios por columnas: sin esto no se vería." >&2
            exit 1
          fi

          # Las funciones necesitan su propio patrón: los paréntesis de los
          # argumentos cortan el nombre antes del « to », así que buscarlas igual
          # que a las tablas dejaba pasar la mitad de los casos.
          if [ "$(contar 'on \(table [a-z_]* to \|function [a-z_]*(\)' respaldo-permisos.sql.gz)" -gt 0 ]; then
            echo "El respaldo de permisos tiene nombres sin calificar con su esquema." >&2
            echo "Al aplicarlo, esos permisos irían a la tabla equivocada o a ninguna." >&2
            exit 1
          fi

          echo "El volcado incluye public, private, las cuentas, las migraciones y Storage."

      - name: Subir a R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BALDE: ${{ vars.R2_BUCKET_RESPALDOS }}
        run: |
          if [ -z "$BALDE" ]; then
            echo "Falta la variable R2_BUCKET_RESPALDOS." >&2
            exit 1
          fi
          FECHA=$(date -u +%Y-%m-%d)
          # El de auth puede no existir: se sube lo que haya, y por eso el bucle
          # recorre los archivos presentes en vez de una lista fija. El patrón
          # toma `.dump` además de `.sql.gz`; con el patrón viejo el archivo más
          # importante se quedaba en el servidor.
          for archivo in respaldo-completo.dump respaldo-*.sql.gz; do
            npx --yes wrangler@4 r2 object put \
              "${BALDE}/${FECHA}/${archivo}" \
              --file "${archivo}" \
              --remote
          done
          echo "Respaldo del $FECHA subido a $BALDE."
